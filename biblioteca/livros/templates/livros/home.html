{% extends 'livros/master.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <section class="page-title">
    <p class="eyebrow">Biblioteca Publica</p>
    <h1>{{ title }}</h1>
  </section>

  <section class="catalog-tools" aria-label="Pesquisar e filtrar livros">
    <label class="search-box">
      <span>Pesquisar</span>
      <input type="search" name="q" placeholder="titulo, ISBN ou editora">
    </label>
    <label>
      <span>Tipo</span>
      <select name="tipo">
        <option value="">Todos</option>
      </select>
    </label>
    <label>
      <span>Tema</span>
      <select name="tema">
        <option value="">Todos</option>
      </select>
    </label>
    <label>
      <span>Status</span>
      <select name="status">
        <option value="">Todos</option>
      </select>
    </label>
    <button class="button" type="button">Filtrar</button>
  </section>

  {% include 'livros/_book_grid.html' with grid_label='Livros registados' %}
{% endblock %}
