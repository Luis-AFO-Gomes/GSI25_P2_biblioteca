
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    :root { color-scheme: light dark; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(120,170,255,.25), transparent),
                  radial-gradient(900px 500px at 90% 30%, rgba(255,120,200,.18), transparent),
                  linear-gradient(180deg, rgb(189, 129, 214), rgb(137, 167, 203));
    }
    .card{
      width:min(720px, 92vw);
      padding:28px 26px;
      border-radius:18px;
      border:1px solid rgba(252, 145, 145, 0.25);
      background: rgba(255,255,255,.20);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1{
      margin:0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .5px;
    }
    p{
      margin: 0;
      opacity: .85;
      font-size: 16px;
      line-height: 1.5;
    }
    .badge{
      display:inline-block;
      margin-top:14px;
      padding:8px 12px;
      border-radius:999px;
      font-size: 13px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(128, 128, 128, 0.2);
    }
    code{ opacity:.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <p>Hello World!... Bem vindo ao Django!</p>
<!--    <p>Hello {{ nome }}!... Bem vindo ao Django!</p> -->
    <div class="badge">URL : {{ request.get_host }}{{ request.path }} • Method: {{ request.method }} </div>
    <p>{{ request }}</p>
  </div>
</body>
</html>
